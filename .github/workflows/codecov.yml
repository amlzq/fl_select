name: Monorepo Test and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ fl_select, fl_select_genui ]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      # pub workspace: dependencies are resolved once at the repository root.
      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: flutter test --coverage

      # Flutter emits package-relative paths (`SF:lib/...`). Prefix them so the
      # flag paths in codecov.yml (`packages/<pkg>/`) resolve against the repo.
      - name: Make lcov paths repo-relative
        working-directory: packages/${{ matrix.package }}
        run: sed -i 's|^SF:lib/|SF:packages/${{ matrix.package }}/lib/|' coverage/lcov.info

      - name: Upload ${{ matrix.package }} coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: true
