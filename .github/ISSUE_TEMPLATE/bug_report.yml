name: Bug report
description: Report something in fl_select that isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Before opening an issue, please:
        - Search existing issues to avoid duplicates.
        - Upgrade to the latest release on pub.dev — the bug may already be fixed.
        - Reproduce the problem with the smallest possible code sample.

  - type: dropdown
    id: component
    attributes:
      label: Which API or component is affected?
      options:
        - PopupSelectBar
        - PopupSelectButton
        - SelectView
        - showSelect
        - showModalBottomSelect
        - CascadingSelectDelegate
        - GridSelectDelegate
        - ListSelectDelegate
        - FlattenSelectDelegate
        - Search (SelectSearchBar / search filtering)
        - Entries (SelectCategoryEntry / SelectTextEntry / SelectRangeEntry)
        - Serialization (toQueryMap / toQueryParameters)
        - Theming (SelectThemeData / PopupSelectBarTheme / PopupSelectButtonTheme)
        - Localization (SelectLocalizationsDelegate)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Be exact — small details matter.
      placeholder: |
        1. Build a PopupSelectBar with a FlattenSelectDelegate...
        2. Tap the 'More' tab...
        3. Observe that...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected results
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual results
      description: What actually happened? If there is an exception, paste the full message below.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code sample
      description: |
        A minimal, self-contained sample that reproduces the bug.
        Ideally a `main.dart` that can be run with `flutter run`.
      render: dart
      value: |
        import 'package:fl_select/fl_select.dart';
        import 'package:flutter/material.dart';

        void main() => runApp(const MyApp());

        class MyApp extends StatelessWidget {
          const MyApp({super.key});

          @override
          Widget build(BuildContext context) {
            // ... code that reproduces the issue
            return const MaterialApp();
          }
        }
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any console output, exceptions, or stack traces. This is formatted as code.
      render: shell

  - type: textarea
    id: flutter-doctor
    attributes:
      label: Flutter doctor output
      description: Paste the output of running `flutter doctor -v` in a terminal.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: fl_select version
      description: Run `flutter pub deps` or check pubspec.lock if unsure.
      placeholder: e.g. 0.8.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platforms affected
      description: Select every platform where you can reproduce the bug.
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
        - Not platform-specific
    validations:
      required: true
