name: fl_select_genui
description: >-
  GenUI SDK (A2UI) integration for fl_select. Provides ready-made
  CatalogItems so conversational AI agents can render fl_select filter
  widgets inside chat surfaces and receive user selections as structured
  query data.
version: 0.0.1
repository: https://github.com/amlzq/fl_select/tree/main/packages/fl_select_genui
issue_tracker: https://github.com/amlzq/fl_select/issues
topics: [ui, widget, ai, chatbot, select, menu, picker]

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.7"

# This package is resolved via the repository root pub workspace (melos).
resolution: workspace

dependencies:
  fl_select: ^0.10.0
  flutter:
    sdk: flutter
  genui: ^0.10.2
  json_schema_builder: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
