name: example
description: "Example of fl_select_genui: rendering an agent-authored Select."
publish_to: "none"
version: 0.7.0

environment:
  sdk: ^3.13.5

dependencies:
  fl_select_genui:
    path: ../
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  genui: ^0.10.4
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fl_select: ^0.17.0

flutter:
  uses-material-design: true

dependency_overrides:
  # 2.12.3 needs a newer Swift toolchain than Xcode ships on this macOS.
  video_player_avfoundation: 2.12.0
