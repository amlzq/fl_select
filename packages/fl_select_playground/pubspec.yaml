name: fl_select_playground
description: "Interactive playground for the fl_select package."
publish_to: "none"
version: 0.11.0

environment:
  sdk: ^3.10.9

# Resolved via the repository root pub workspace (melos).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  fl_select: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cascading.json

