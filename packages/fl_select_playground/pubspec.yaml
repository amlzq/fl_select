name: fl_select_playground
description: "Interactive playground for the fl_select package."
publish_to: "none"
version: 0.12.2

environment:
  sdk: ^3.10.9

# Resolved via the repository root pub workspace (melos).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  fl_select: ^0.12.2
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cascading.json

  # Roboto is bundled locally so the web engine (CanvasKit) never falls back
  # to fetching it from fonts.gstatic.com — which fails in offline or
  # network-restricted environments. Files copied from the Flutter SDK cache
  # (bin/cache/artifacts/material_fonts); see Roboto_LICENSE.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

