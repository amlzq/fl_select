name: fl_select_workspace
publish_to: none
environment:
  sdk: ^3.9.0

# Dart Pub Workspace — all packages in this repository share one resolution.
# (Melos 7+ requires this instead of the legacy melos.yaml.)
workspace:
  - packages/fl_select
  - packages/fl_select_genui
  - packages/fl_select_playground

dev_dependencies:
  melos: ^8.3.0

melos:
  commands:
    test:
      exec:
        run: flutter test
        concurrency: 1
  scripts:
    check:format:
      description: Fail if any Dart file (whole workspace) is not formatted.
      run: dart format --set-exit-if-changed .
    check:analyze:
      description: >-
        Run dart analyze on the whole workspace (warnings/errors are fatal;
        infos like playground's deprecated API demos are allowed).
      run: flutter analyze --no-fatal-infos
    check:pana:
      description: >-
        Pre-publish score gate: run pana (pub.dev's scorer) on publishable
        packages. Fails when (max points - granted points) exceeds the
        threshold. Current known loss: fl_select_genui loses 10 points on
        platform support via transitive video_player from genui
        (upstream flutter/genui#734) — tighten the threshold once that is
        resolved.
      run: |-
        set -e
        dart pub global activate pana
        for pkg in fl_select fl_select_genui; do
          echo "==> pana: packages/$pkg"
          (cd "packages/$pkg" && "$HOME/.pub-cache/bin/pana" . --exit-code-threshold 10)
        done
    check:publish:
      description: Validate publishing (dart publish --dry-run) for publishable packages.
      run: |-
        set -e
        for pkg in fl_select fl_select_genui; do
          echo "==> dry-run: packages/$pkg"
          (cd "packages/$pkg" && dart pub publish --dry-run)
        done
    check:
      description: Run all pre-publish gates (format, analyze, test, pana score, publish dry-run).
      run: >-
        melos run check:format &&
        melos run check:analyze &&
        melos test &&
        melos run check:pana &&
        melos run check:publish
    example:run:
      description: Run the fl_select example app (debug mode).
      run: cd packages/fl_select/example && flutter run
    example:build-web:
      description: Build the example app for web.
      run: cd packages/fl_select/example && flutter build web --release
    playground:run:
      description: Run the fl_select playground app (debug mode).
      run: cd packages/fl_select_playground && flutter run
    playground:build-web:
      description: Build the playground app for web (what CI deploys).
      run: cd packages/fl_select_playground && flutter build web --release
